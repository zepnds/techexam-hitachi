server.port=${SERVER_PORT:8081}

spring.application.name=notification-backend-core
spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false

# Platform specific configurations
notification.nats.enabled=${NOTIFICATION_NATS_ENABLED:false}
notification.nats.server-url=${NATS_SERVER_URL:nats://localhost:4222}
notification.nats.subject-prefix=notification.events
notification.nats.dlq-subject=notification.dlq.events
notification.nats.stream-name=NOTIFICATION_STREAM
notification.nats.queue-group=notification-workers

notification.queue.capacity=10000
notification.queue.worker-threads=8

notification.retry.max-attempts=3
notification.retry.initial-interval-ms=1000
notification.retry.multiplier=2.0
notification.retry.max-interval-ms=10000
notification.retry.jitter=true

notification.cep.rules-file=classpath:rules-config.json

notification.gateways.simulate-latency-ms=50
notification.gateways.failure-simulation.enabled=true
notification.gateways.failure-simulation.transient-failure-rate=0.15
notification.gateways.failure-simulation.permanent-failure-rate=0.02

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-SYSTEM}] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.notification.platform=DEBUG
