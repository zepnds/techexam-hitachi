server.port=8080

spring.application.name=notification-backend-gateway
spring.jackson.serialization.write-dates-as-timestamps=false

# Gateway upstream backend service target
gateway.backend-core.base-url=${BACKEND_CORE_URL:http://localhost:8081}
gateway.backend-core.connect-timeout-ms=3000
gateway.backend-core.read-timeout-ms=5000

gateway.rate-limit.enabled=true
gateway.rate-limit.requests-per-minute=5000

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-GATEWAY}] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.notification.gateway=DEBUG
